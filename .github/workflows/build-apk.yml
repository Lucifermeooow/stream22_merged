name: Stream 22 - Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Stream 22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Show project structure
        shell: bash
        run: |
          set -u

          echo "=== Current directory ==="
          pwd

          echo "=== Top level ==="
          ls -la

          echo "=== Gradle files ==="
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \
            \) \
            | sort

          echo "=== Application files ==="
          find . -maxdepth 3 -type f \
            \( -name "AndroidManifest.xml" \
            -o -name "gradlew" \
            -o -name "pubspec.yaml" \
            \) \
            | sort

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$KEYSTORE"
          ls -lh "$KEYSTORE"

      - name: Build Android Release
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            exit 0
          fi

          echo "No Gradle wrapper in repository."
          echo "Using installed Gradle 9.7.1."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            gradle :app:assembleRelease \
              --no-daemon \
              --stacktrace
            exit 0
          fi

          echo "::error::No Gradle settings file found in repository root."
          exit 1

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK files ==="
          find . -type f -name "*.apk" -print | sort

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not generated."
            exit 1
          fi

          echo "Found APK:"
          ls -lh "$APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stream22-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
