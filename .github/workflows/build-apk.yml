name: Stream 22 - Android Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Stream 22 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # AGP 9.1.x requires Gradle >= 9.3.1.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -n 'include(":app")' settings.gradle.kts
          grep -n 'agp = "9.1.1"' gradle/libs.versions.toml

      # The current Stream 22 Android module uses the default debug signing config
      # for its release build. Re-create the standard debug keystore on the CI runner.
      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$KEYSTORE"
          ls -lh "$KEYSTORE"

      # The current Red5 code reads these values from BuildConfig.
      # The values are already present in Red5Config.kt in this repository.
      # Mirror them into BuildConfig during CI so the checked-in source does not
      # need to be edited manually.
      - name: Generate Red5 BuildConfig fields
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          config = Path("app/src/main/java/com/ahmed/streamgit101/red5/Red5Config.kt")
          gradle_file = Path("app/build.gradle.kts")

          text = config.read_text(encoding="utf-8")
          host_match = re.search(r'const\s+val\s+streamManagerHost:\s*String\s*=\s*"([^"]+)"', text)
          license_match = re.search(r'const\s+val\s+sdkLicenseKey:\s*String\s*=\s*"([^"]+)"', text)

          if not host_match or not license_match:
              raise SystemExit("Could not read Red5 host/license from Red5Config.kt")

          host = host_match.group(1)
          license_key = license_match.group(1)

          gradle = gradle_file.read_text(encoding="utf-8")

          host_line = f'        buildConfigField("String", "RED5_STREAM_MANAGER_HOST", "\\"{host}\\"")'
          license_line = f'        buildConfigField("String", "RED5_SDK_LICENSE_KEY", "\\"{license_key}\\"")'

          if "RED5_STREAM_MANAGER_HOST" not in gradle:
              marker = '        versionName = "22.0.0"'
              if marker not in gradle:
                  raise SystemExit("Could not find defaultConfig insertion point")
              gradle = gradle.replace(
                  marker,
                  marker + "\n\n" + host_line + "\n" + license_line,
                  1,
              )

          gradle_file.write_text(gradle, encoding="utf-8")
          print("Red5 BuildConfig fields prepared.")
          PY

          grep -n "RED5_" app/build.gradle.kts

      - name: Download Red5 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/download_red5_android_sdk.sh
          ./scripts/download_red5_android_sdk.sh
          test -s app/libs/red5-cloud-sdk.aar
          ls -lh app/libs/red5-cloud-sdk.aar

      - name: Show Gradle version
        run: gradle --version

      - name: Clean
        run: gradle clean --no-daemon

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            find app/build -type f -name "*.apk" -print | sort || true
            exit 1
          fi

          echo "Release APK:"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: stream22-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
